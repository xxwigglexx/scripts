# Mantem o projeto Supabase (plano gratis) ativo: ele pausa apos ~1 semana sem uso.
# Uso: no repositorio xxwigglexx/scripts substitua  .github/workflows/ping-supabase.yml  por este conteudo.
# Antes, rode biblioteca\supabase\002_keepalive.sql no SQL Editor do Supabase (cria a funcao keepalive_ping).
# 28/10/2026: o ping antigo (so leitura, a cada 3 dias) NAO impediu a pausa. Agora: TODO DIA e GRAVANDO no banco.
# Usa so a chave PUBLICA (a mesma que ja vai nos scripts). Pode ser disparado na mao (aba Actions > Run workflow).
name: ping-supabase
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gravar no banco (keepalive_ping)
        run: |
          curl -fsS -X POST "https://tryqpnuamhzaxfidcgtg.supabase.co/rest/v1/rpc/keepalive_ping" \
            -H "apikey: sb_publishable_ElfMwNQzvUUXowTiR9A0Hg_ZNeCtgXW" \
            -H "Content-Type: application/json" \
            -d '{}'
      - name: Chamar validate_license
        run: |
          curl -fsS -X POST "https://tryqpnuamhzaxfidcgtg.supabase.co/rest/v1/rpc/validate_license" \
            -H "apikey: sb_publishable_ElfMwNQzvUUXowTiR9A0Hg_ZNeCtgXW" \
            -H "Content-Type: application/json" \
            -d '{"p_key":"PING","p_game":"PING","p_user_id":0}'
